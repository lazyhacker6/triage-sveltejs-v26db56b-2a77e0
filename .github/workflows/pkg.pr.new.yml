name: Publish to pkg.pr.new
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["!**"]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'PDFtoMark/triage-sveltejs-v26db56b-2a77e0'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create output metadata
        run: |
          printf '%s\n' '{"packages":[{"name":"svelte-eslint-parser","url":"https://pkg.pr.new/svelte-eslint-parser@deadbeef"}],"number":1,"event_name":"pull_request","ref":"refs/pull/1/merge","sha":"deadbeef"}' > output.json
      - name: Upload output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: output
          path: |
            output.json
            tools/pkg.pr.new-comment.mjs
